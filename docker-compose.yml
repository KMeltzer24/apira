services:
  user-service:
    build: ./user-service
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=${DATABASE_URL}

  portfolio-service:
    build: ./portfolio-service
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=${DATABASE_URL}

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - user-service
      - portfolio-service
